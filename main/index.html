<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        body {
            background-image: url("C:/Users/user/Downloads/9961350ab8600116eb82cd66342d87c4.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            width: 45%;
            padding: 20px;
            margin: 50px auto;
            border: 2px solid rgb(242, 241, 241);
            border-radius: 20px;
            background-color: white;
            box-shadow: 0 0 15px rgba(55, 154, 230, 0.8);
            box-sizing: border-box;
        }

        .searchpanel {
            width: 100%;
            border: 2px solid black;
            border-radius: 40px;
            padding: 5px;
            display: flex;
            box-sizing: border-box;
        }

        #searchpanel {
            flex: 1;
            padding: 12px 20px;
            border: none;
            outline: none;
            font-size: 16px;
            background: transparent;
        }

        .searchbutton {
            padding: 10px 25px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 16px;
        }

        .container-results {
            width: 45%;
            padding: 20px;
            margin: 20px auto;
            border: 2px solid rgb(242, 241, 241);
            border-radius: 20px;
            background-color: white;
            box-shadow: 0 0 15px rgba(55, 154, 230, 0.8);
            box-sizing: border-box;
        }

        .result {
            font-size: 35px;
            margin-bottom: 15px;
        }

        .course_button {
            padding: 20px 80px;
            border: none;
            font-size: 15px;
            cursor: pointer;
            border-radius: 8px;
            color: white;
            margin-right: 10px;
            background-color: rgb(85, 222, 85);
        }

        .series_button {
            padding: 20px 80px;
            border: none;
            font-size: 15px;
            cursor: pointer;
            border-radius: 8px;
            color: white;
            margin-right: 10px;
            background-color: rgb(85, 122, 222);
        }

        .devoir_button {
            padding: 20px 80px;
            border: none;
            font-size: 15px;
            cursor: pointer;
            border-radius: 8px;
            color: white;
            background-color: rgb(222, 149, 85);
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="searchpanel">

            <input
                type="text"
                id="searchpanel"
                placeholder="Search for the course"
            >

            <button class="searchbutton">
                Search
            </button>

        </div>

    </div>

    <div
        class="container-results"
        id="container-results">
    </div>

    <script src="main.js"></script>
</body>
</html>
